<mat-toolbar color="primary" class="toolbar">
  <a routerLink="/" class="brand">
    <mat-icon>school</mat-icon>
    <span>Plataforma de Cursos</span>
  </a>

  <span class="spacer"></span>

  @if (auth.isAuthenticated()) {
    <a mat-button routerLink="/courses">Catálogo</a>

    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin/dashboard">Admin</a>
    } @else {
      <a mat-button routerLink="/dashboard">O Meu Progresso</a>
    }

    <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu do utilizador">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="menu-user-info">
        <strong>{{ auth.currentUser()?.name }}</strong>
        <span>{{ auth.currentUser()?.email }}</span>
      </div>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Terminar sessão</span>
      </button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/auth/login">Entrar</a>
    <a mat-raised-button color="accent" routerLink="/auth/register">Registar</a>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
